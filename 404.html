<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!--
      웹 전용 HTML 틀(Expo 기본 틀을 복사해 고친 것). 앱처럼 보이게 두 손가락 확대·축소와 두 번 눌러 확대를 막는다(사용자 결정 11-08).
      - user-scalable=no / maximum-scale=1: 안드로이드 크롬 등에서 확대를 막는다.
      - touch-action: manipulation: 두 번 눌러 확대(더블 탭 줌)를 막는다.
      - 아래 스크립트: iOS 사파리는 viewport 설정을 무시하고 확대를 허용하므로 gesturestart·두 손가락 touchmove를 따로 막는다. [실기기 확인 필요]
      글자 크기를 키우는 기기 설정에는 영향이 없다. 확대를 막는 만큼 접근성이 줄어드는 점은 사용자가 알고 정한 것이다.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no" />
    <title>밍팔</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        touch-action: manipulation;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <script>
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
        document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
      });
      document.addEventListener('touchmove', function (e) {
        if (e.touches && e.touches.length > 1) e.preventDefault();
      }, { passive: false });
    </script>
  <link rel="icon" href="/mingpal-preview/favicon.ico"/></head>
